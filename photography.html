<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Photography</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .gallery {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }
    .gallery img {
      width: 30%;
      height: auto;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Photography</h1>
  <div class="gallery">
    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="Photo 1">
    <img src="https://images.unsplash.com/photo-1465101162946-4377e57745c3" alt="Photo 2">
    <img src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d" alt="Photo 3">
  </div>
</body>
</html>

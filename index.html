<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Help bust cached builds -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Wael Salih | Photography & Film</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0a0a;
      --bg-secondary: #111111;
      --text: #ffffff;
      --text-muted: #888888;
      --overlay: rgba(0, 0, 0, 0.6);
      --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-weight: 300;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Navigation */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 1.5rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background var(--transition), padding var(--transition);
    }

    .navbar.scrolled {
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      padding: 1rem 3rem;
    }

    .logo {
      display: flex;
      align-items: center;
      font-family: "Bebas Neue", sans-serif;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-size: 1.1rem;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      transition: color var(--transition);
      position: relative;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--text);
      transition: width var(--transition);
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text);
    }

    .nav-links a:hover::after,
    .nav-links a.active::after {
      width: 100%;
    }

    /* Mobile Menu Toggle */
    .menu-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      z-index: 1001;
    }

    .menu-toggle span {
      width: 25px;
      height: 1px;
      background: var(--text);
      transition: var(--transition);
    }

    /* Hero Section */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .hero-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1;
    }

    .hero-bg iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 177.78vh;
      height: 100vh;
      min-width: 100%;
      min-height: 56.25vw;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero-logo {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(2rem, 8vw, 5rem);
      letter-spacing: 0.3em;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 1s ease 0.3s forwards;
    }

    .hero-tagline {
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text);
      opacity: 0;
      animation: fadeUp 1s ease 0.6s forwards;
    }

    .hero-tagline span {
      display: inline-block;
      margin: 0 0.75rem;
    }

    .scroll-hint {
      position: absolute;
      bottom: 3rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      opacity: 0;
      animation: fadeUp 1s ease 0.9s forwards;
    }

    .scroll-hint span {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .scroll-line {
      width: 1px;
      height: 50px;
      background: linear-gradient(to bottom, var(--text-muted), transparent);
      animation: scrollPulse 2s ease-in-out infinite;
    }

    /* Section Styles */
    section {
      padding: 6rem 3rem;
    }

    .section-header {
      text-align: center;
      margin-bottom: 4rem;
    }

    .section-title {
      font-family: "Bebas Neue", sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .section-line {
      width: 40px;
      height: 1px;
      background: var(--text);
      margin: 0 auto;
    }

    /* Portfolio Grid */
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .portfolio-item {
      position: relative;
      overflow: hidden;
      aspect-ratio: 4/3;
      cursor: pointer;
      background: var(--bg-secondary);
    }

    .portfolio-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease, filter 0.6s ease;
      filter: grayscale(30%);
    }

    .portfolio-item:hover img {
      transform: scale(1.08);
      filter: grayscale(0%);
    }

    .portfolio-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.9) 0%,
        rgba(0, 0, 0, 0.3) 50%,
        transparent 100%
      );
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 1.5rem;
      opacity: 0;
      transition: opacity var(--transition);
    }

    .portfolio-item:hover .portfolio-overlay {
      opacity: 1;
    }

    .portfolio-title {
      font-family: "Bebas Neue", sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.1em;
      margin-bottom: 0.25rem;
      transform: translateY(20px);
      transition: transform var(--transition);
    }

    .portfolio-item:hover .portfolio-title {
      transform: translateY(0);
    }

    .portfolio-category {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      transform: translateY(20px);
      transition: transform var(--transition) 0.05s;
    }

    .portfolio-item:hover .portfolio-category {
      transform: translateY(0);
    }

    /* Contact Section */
    .contact-section {
      text-align: center;
      padding: 8rem 3rem;
      background: var(--bg-secondary);
    }

    .contact-title {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(2rem, 6vw, 4rem);
      letter-spacing: 0.2em;
      margin-bottom: 2rem;
    }

    .contact-btn {
      display: inline-block;
      padding: 1rem 3rem;
      border: 1px solid var(--text);
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      transition: background var(--transition), color var(--transition);
    }

    .contact-btn:hover {
      background: var(--text);
      color: var(--bg);
    }

    /* Footer */
    footer {
      padding: 3rem;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .social-links a {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      transition: color var(--transition);
    }

    .social-links a:hover {
      color: var(--text);
    }

    .copyright {
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.97);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      cursor: zoom-out;
    }

    .lightbox.active {
      opacity: 1;
      visibility: visible;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      transform: scale(0.95);
      transition: transform 0.4s ease;
    }

    .lightbox.active img {
      transform: scale(1);
    }

    .lightbox-close {
      position: absolute;
      top: 2rem;
      right: 2rem;
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.5rem;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity var(--transition);
      font-family: "Montserrat", sans-serif;
      font-weight: 300;
      letter-spacing: 0.2em;
    }

    .lightbox-close:hover {
      opacity: 1;
    }

    /* Animations */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes scrollPulse {
      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 1;
      }
    }

    /* Scroll Reveal */
    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .portfolio-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .portfolio-item.large {
        grid-column: span 2;
      }

      section {
        padding: 4rem 2rem;
      }
    }

    @media (max-width: 768px) {
      .navbar {
        padding: 1.25rem 1.5rem;
      }

      .nav-links {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--bg);
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 2rem;
        opacity: 0;
        visibility: hidden;
        transition: opacity var(--transition), visibility var(--transition);
      }

      .nav-links.active {
        opacity: 1;
        visibility: visible;
      }

      .nav-links a {
        font-size: 1rem;
      }

      .menu-toggle {
        display: flex;
      }

      .menu-toggle.active span:nth-child(1) {
        transform: rotate(45deg) translate(4px, 4px);
      }

      .menu-toggle.active span:nth-child(2) {
        opacity: 0;
      }

      .menu-toggle.active span:nth-child(3) {
        transform: rotate(-45deg) translate(4px, -4px);
      }

      .portfolio-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
    }
  </style>
</head>

  <script>
    // Navbar scroll effect
    const navbar = document.querySelector(".navbar");
    window.addEventListener("scroll", () => {
      navbar.classList.toggle("scrolled", window.scrollY > 100);
    });

    // Mobile menu toggle
    const menuToggle = document.querySelector(".menu-toggle");
    const navLinks = document.querySelector(".nav-links");

    const toggleMenu = () => {
      menuToggle.classList.toggle("active");
      navLinks.classList.toggle("active");
    };

    menuToggle.addEventListener("click", toggleMenu);
    menuToggle.addEventListener("keypress", (e) => {
      if (e.key === "Enter" || e.key === " ") toggleMenu();
    });

    // Close menu on link click
    document.querySelectorAll(".nav-links a").forEach((link) => {
      link.addEventListener("click", () => {
        menuToggle.classList.remove("active");
        navLinks.classList.remove("active");
      });
    });

    // Lightbox
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");

    document.querySelectorAll(".portfolio-item").forEach((item) => {
      item.addEventListener("click", () => {
        const img = item.querySelector("img");
        lightboxImg.src = img.src;
        lightbox.classList.add("active");
        document.body.style.overflow = "hidden";
      });
    });

    const closeLightbox = () => {
      lightbox.classList.remove("active");
      document.body.style.overflow = "";
    };

    lightbox.addEventListener("click", closeLightbox);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeLightbox();
    });

    // Scroll reveal
    const revealElements = document.querySelectorAll(".reveal");

    const revealOnScroll = () => {
      revealElements.forEach((el, index) => {
        const rect = el.getBoundingClientRect();
        if (rect.top < window.innerHeight - 100) {
          setTimeout(() => {
            el.classList.add("visible");
          }, index * 50);
        }
      });
    };

    window.addEventListener("scroll", revealOnScroll);
    window.addEventListener("load", revealOnScroll);
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: #000000;
      color: #ffffff;
      line-height: 1.6;
      font-weight: 300;
      letter-spacing: 0.5px;
    }
    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }
    .video-bg iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 100vh;
      transform: translate(-50%, -50%);
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      object-fit: cover;
    }
    @media (min-aspect-ratio: 16/9) {
      .video-bg iframe {
        height: 100vh;
        width: 177.77vh; /* 16:9 ratio */
      }
    }
    @media (max-aspect-ratio: 16/9) {
      .video-bg iframe {
        width: 100vw;
        height: 56.25vw; /* 16:9 ratio */
      }
    }
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      padding: 20px;
      display: flex;
      gap: 10px;
    }
    .nav a {
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: rgba(0,0,0,0.3);
      padding: 10px 18px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .nav a:hover {
      background: rgba(0,0,0,0.6);
      border-color: rgba(255,255,255,0.3);
    }
    .nav a.active {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.4);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .hero {
      position: relative;
      z-index: 1;
      color: white;
      text-align: center;
      padding-top: 50vh;
      height: 100vh;
    }
    .hero h1 {
      font-size: 4rem;
      margin-bottom: 10px;
      font-weight: 200;
      letter-spacing: 3px;
    }
    .hero p {
      opacity: 0.8;
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 2px;
    }
    .content-section {
      background: #0e0e0e;
      min-height: 100vh;
      padding-top: 100px;
    }
    .content-section h1 {
      text-align: center;
      font-size: 3rem;
      margin-bottom: 40px;
      font-weight: 200;
      letter-spacing: 3px;
    }
    .gallery {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      flex-wrap: wrap;
      max-width: 1400px;
      margin: 0 auto;
    }
    .gallery iframe {
      width: 404px;
      height: 316px;
      border: none;
    }
    .videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
      gap: 30px;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }
    .videos iframe {
      width: 100%;
      height: 315px;
      border: none;
    }
    @media (max-width: 768px) {
      .videos {
        grid-template-columns: 1fr;
      }
      .gallery {
        flex-direction: column;
        align-items: center;
      }
      .gallery iframe {
        width: 100%;
        max-width: 404px;
      }
      .hero h1 {
        font-size: 2.5rem;
      }
    }
  </style>

  <script>
    function showTab(tabName) {
      // Hide all tabs
      const tabs = document.querySelectorAll('.tab-content');
      tabs.forEach(tab => tab.classList.remove('active'));
      
      // Remove active class from all nav links
      const navLinks = document.querySelectorAll('.nav a');
      navLinks.forEach(link => link.classList.remove('active'));
      
      // Show selected tab
      document.getElementById(tabName).classList.add('active');
      document.getElementById(tabName + '-tab').classList.add('active');
    }
  </script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Wael Salih | Videos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500&display=swap"

  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0a0a;
      --bg-secondary: #111111;
      --text: #ffffff;
      --text-muted: #888888;
      --overlay: rgba(0, 0, 0, 0.4);
      --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    html {
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-weight: 300;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Navigation */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 1.5rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%);
      transition: background var(--transition), padding var(--transition);
    }

    .navbar.scrolled {
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      padding: 1rem 3rem;
    }

    .logo {
      display: flex;
      align-items: center;
      font-family: "Bebas Neue", sans-serif;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-size: 1.1rem;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      transition: color var(--transition);
      position: relative;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--text);
      transition: width var(--transition);
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text);
    }

    .nav-links a:hover::after,
    .nav-links a.active::after {
      width: 100%;
    }

    /* Mobile Menu Toggle */
    .menu-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      z-index: 1001;
    }

    .menu-toggle span {
      width: 25px;
      height: 1px;
      background: var(--text);
      transition: var(--transition);
    }

    /* Video Sections */
    .video-section {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      scroll-snap-align: start;
      display: flex;
      alignments center;
      justify-content: center;
    }

    .video-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .video-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--overlay);
      z-index: 1;
      pointer-events: none;
    }

    .video-bg iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* Aspect ratio handling for different videos */
    .video-bg.wide iframe {
      /* 2.39:1 aspect ratio videos */
      width: 177.78vh;
      height: 100vh;
      min-width: 100%;
      min-height: 41.89vw;
    }

    .video-bg.portrait iframe {
      /* ~1.9:1 aspect ratio videos */
      width: 100vw;
      height: 52.73vw;
      min-width: 189.64vh;
      min-height: 100vh;
    }

    .video-bg.square iframe {
      /* ~1.37:1 aspect ratio videos */
      width: 137vh;
      height: 100vh;
      min-width: 100%;
      min-height: 72.99vw;
    }

    /* Video Info Overlay */
    .video-info {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2rem;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .video-section:hover .video-info,
    .video-section.in-view .video-info {
      opacity: 1;
      transform: translateY(0);
    }

    .video-title {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(2rem, 6vw, 4rem);
      letter-spacing: 0.2em;
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }

    /* Section Counter */
    .section-counter {
      position: fixed;
      right: 3rem;
      top: 50%;
      transform: translateY(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .counter-dot {
      width: 10px;
      height: 10px;
      border: 1px solid var(--text-muted);
      border-radius: 50%;
      cursor: pointer;
      transition: var(--transition);
    }

    .counter-dot.active {
      background: var(--text);
      border-color: var(--text);
    }

    .counter-dot:hover {
      border-color: var(--text);
    }

    /* Scroll Hint */
    .scroll-hint {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      alignments center;
      gap: 0.5rem;
      opacity: 1;
      transition: opacity var(--transition);
    }

    .scroll-hint.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .scroll-hint span {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .scroll-line {
      width: 1px;
      height: 40px;
      background: linear-gradient(to bottom, var(--text-muted), transparent);
      animation: scrollPulse 2s ease-in-out infinite;
    }

    @keyframes scrollPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .navbar {
        padding: 1.25rem 1.5rem;
      }

      .nav-links {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--bg);
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 2rem;
        opacity: 0;
        visibility: hidden;
        transition: opacity var(--transition), visibility var(--transition);
      }

      .nav-links.active {
        opacity: 1;
        visibility: visible;
      }

      .nav-links a {
        font-size: 1rem;
      }

      .menu-toggle {
        display: flex;
      }

      .menu-toggle.active span:nth-child(1) {
        transform: rotate(45deg) translate(4px, 4px);
      }

      .menu-toggle.active span:nth-child(2) {
        opacity: 0;
      }

      .menu-toggle.active span:nth-child(3) {
        transform: rotate(-45deg) translate(4px, -4px);
      }

      .section-counter {
        right: 1rem;
      }

      .video-title {
        letter-spacing: 0.1em;
      }
    }
  </style>
</head>

  <script>
    // Navbar scroll effect
    const navbar = document.querySelector(".navbar");
    window.addEventListener("scroll", () => {
      navbar.classList.toggle("scrolled", window.scrollY > 100);
    });

    // Mobile menu toggle
    const menuToggle = document.querySelector(".menu-toggle");
    const navLinks = document.querySelector(".nav-links");

    const toggleMenu = () => {
      menuToggle.classList.toggle("active");
      navLinks.classList.toggle("active");
    };

    menuToggle.addEventListener("click", toggleMenu);
    menuToggle.addEventListener("keypress", (e) => {
      if (e.key === "Enter" || e.key === " ") toggleMenu();
    });

    // Close menu on link click
    document.querySelectorAll(".nav-links a").forEach((link) => {
      link.addEventListener("click", () => {
        menuToggle.classList.remove("active");
        navLinks.classList.remove("active");
      });
    });

    // Section counter dots & scroll tracking
    const sections = document.querySelectorAll(".video-section");
    const dots = document.querySelectorAll(".counter-dot");
    const scrollHint = document.querySelector(".scroll-hint");

    // Click on dots to scroll to section
    dots.forEach((dot) => {
      dot.addEventListener("click", () => {
        const index = parseInt(dot.dataset.index);
        sections[index].scrollIntoView({ behavior: "smooth" });
      });
    });

    // Update active dot on scroll
    const updateActiveDot = () => {
      let currentIndex = 0;
      const scrollPosition = window.scrollY + window.innerHeight / 2;

      sections.forEach((section, index) => {
        const sectionTop = section.offsetTop;
        const sectionHeight = section.offsetHeight;
        
        if (scrollPosition >= sectionTop && scrollPosition < sectionTop + sectionHeight) {
          currentIndex = index;
        }

        // Add in-view class for title animation
        const rect = section.getBoundingClientRect();
        if (rect.top < window.innerHeight * 0.75 && rect.bottom > window.innerHeight * 0.25) {
          section.classList.add("in-view");
        } else {
          section.classList.remove("in-view");
        }
      });

      dots.forEach((dot, index) => {
        dot.classList.toggle("active", index === currentIndex);
      });

      // Hide scroll hint after first scroll
      if (window.scrollY > 100) {
        scrollHint.classList.add("hidden");
      } else {
        scrollHint.classList.remove("hidden");
      }
    };

    window.addEventListener("scroll", updateActiveDot);
    window.addEventListener("load", updateActiveDot);
  </script>
